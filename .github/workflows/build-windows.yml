name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Install Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-base.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-base.txt
          python -m pip install pyinstaller pytest

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name BoreholeJournalOCR `
            --add-data "app/assets;app/assets" `
            --collect-all pymupdf `
            --collect-all google.genai `
            --collect-submodules keyring `
            --exclude-module paddleocr `
            --exclude-module paddlex `
            --exclude-module paddle `
            main.py

      - name: Prepare distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "release" | Out-Null
          Copy-Item -Recurse "dist" "release\dist"
          Copy-Item -Recurse "app" "release\app"

          $files = @(
            "main.py",
            "requirements-base.txt",
            "requirements-local.txt",
            "install.bat",
            "install_local_ocr.bat",
            "build_exe.ps1",
            "run.bat",
            "README.md"
          )
          Copy-Item $files "release\"

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: BoreholeJournalOCR-Windows
          path: release/
          if-no-files-found: error
          retention-days: 30
